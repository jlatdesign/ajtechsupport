<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario · AJ Tech Support</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ===== Tema oscuro (por defecto) ===== */
:root{
  --bg:#05070f; --bg2:#0b1020; --card:rgba(255,255,255,.035); --card-solid:#0d1324;
  --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.16);
  --text:#e8ecf7; --muted:#8f99b8; --dim:#5d6785;
  --c1:#00e5ff; --c2:#7c4dff; --c3:#ff2fb3;
  --grad:linear-gradient(120deg,var(--c1),var(--c2) 55%,var(--c3));
  --input:rgba(0,0,0,.35); --row-hover:rgba(0,229,255,.05);
  --ok:#2bff88; --warn:#ffc53d; --off:#8f99b8; --bad:#ff4d6d;
  --glow:.22; --grid-line:rgba(124,77,255,.07);
}
/* ===== Tema claro ===== */
:root[data-theme="light"]{
  --bg:#f3f5fb; --bg2:#ffffff; --card:rgba(255,255,255,.85); --card-solid:#ffffff;
  --line:rgba(16,24,48,.10); --line-strong:rgba(16,24,48,.18);
  --text:#121a2e; --muted:#5a6482; --dim:#8a93ad;
  --c1:#0094b8; --c2:#6a3df0; --c3:#d61f8f;
  --input:#ffffff; --row-hover:rgba(106,61,240,.05);
  --ok:#0f9d58; --warn:#b7791f; --off:#6b7280; --bad:#d6334f;
  --glow:.10; --grid-line:rgba(106,61,240,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);
  font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  min-height:100vh;overflow-x:hidden;
}
/* fondo: rejilla + brillos */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%);
}
.glow{position:fixed;width:560px;height:560px;border-radius:50%;filter:blur(140px);opacity:var(--glow);z-index:-1;pointer-events:none}
.g1{background:var(--c2);top:-220px;left:-160px}.g2{background:var(--c1);bottom:-260px;right:-160px}

h1,h2,h3,.brand{font-family:"Space Grotesk",sans-serif}
.mono,td.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
a{color:var(--c1)}

/* ===== Header ===== */
header{
  position:sticky;top:0;z-index:20;
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
  padding:14px 20px;background:rgba(5,7,15,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
:root[data-theme="light"] header{background:rgba(255,255,255,.8)}
.brand{display:flex;align-items:center;gap:12px}
.logo-mark{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#05070f;font-weight:800;font-size:.95rem;box-shadow:0 0 24px rgba(124,77,255,.55)}
.brand h1{font-size:18px;margin:0;line-height:1.1}
.brand small{display:block;color:var(--muted);font:500 11px/1.2 "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.user-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font:500 12px "JetBrains Mono",monospace;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}

.wrap{max-width:1440px;margin:0 auto;padding:22px 20px 40px}

/* ===== KPIs ===== */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{position:relative;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad)}
.kpi span{display:block;color:var(--muted);font:500 11px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase}
.kpi b{display:block;font:700 28px/1.2 "Space Grotesk",sans-serif;margin-top:6px}
.kpi b.ok{color:var(--ok)} .kpi b.warn{color:var(--warn)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}

/* ===== Tarjetas ===== */
.card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:20px;margin-bottom:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.card-title h3{margin:0;font-size:16px}
.sec{display:flex;align-items:center;gap:10px;margin:0 0 12px;color:var(--muted);font:600 11px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
.sec i{font-style:normal;color:var(--c1)}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-strong),transparent)}
.client-box{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:18px;background:linear-gradient(160deg,rgba(124,77,255,.10),rgba(0,229,255,.04))}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:1fr 2fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.full{grid-column:1/-1}

label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
input,select,textarea{
  font:inherit;color:var(--text);background:var(--input);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s;
}
input::placeholder,textarea::placeholder{color:var(--dim)}
input:focus,select:focus,textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(0,229,255,.12)}
input:invalid:not(:placeholder-shown){border-color:var(--bad)}
#ip,#mac,#serial{font-family:"JetBrains Mono",monospace;letter-spacing:.02em}
select option{background:var(--card-solid);color:var(--text)}
textarea{min-height:44px;resize:vertical}
.pw{display:flex;gap:6px}.pw input{flex:1}
/* Autocompletar dirección */
.addr-wrap{position:relative;display:flex;gap:6px}
.addr-wrap input{flex:1}
.maps-btn{white-space:nowrap;padding:9px 12px}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--card-solid);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 20px 40px -12px rgba(0,0,0,.6);max-height:320px;overflow-y:auto}
.suggest .opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;cursor:pointer;color:var(--text);font-size:13px;border-bottom:1px solid var(--line)}
.suggest .opt:last-child{border-bottom:0}
.suggest .opt:hover,.suggest .opt.on{background:var(--row-hover)}
.suggest .opt.on .t{color:var(--c1)}
.suggest .ic{flex:none;opacity:.8}
.suggest .t{display:block;font-weight:500}
.suggest small{display:block;color:var(--muted);font-size:12px}
.suggest .src{margin-left:auto;flex:none;font:500 10px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.suggest .msg{padding:10px 12px;color:var(--muted);font-size:12px}
td.addr a{color:var(--muted);text-decoration:none}
td.addr a:hover{color:var(--c1)}
.check{flex-direction:row;align-items:center;gap:8px;font-weight:400;cursor:pointer;white-space:nowrap}
.check input{width:16px;height:16px;accent-color:var(--c2)}

/* ===== Botones ===== */
button{
  font:500 13px Inter,sans-serif;cursor:pointer;border:1px solid var(--line);background:var(--card);
  color:var(--text);border-radius:10px;padding:9px 14px;transition:border-color .2s,color .2s,transform .15s,box-shadow .2s;
}
button:hover{border-color:var(--c1);color:var(--c1)}
button.sm{padding:4px 8px;font-size:12px;border-radius:8px}
button.primary{background:var(--grad);color:#05070f;border:0;font-weight:700;box-shadow:0 8px 24px -8px rgba(124,77,255,.7)}
button.primary:hover{color:#05070f;transform:translateY(-1px);box-shadow:0 12px 30px -8px rgba(0,229,255,.7)}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.6;cursor:wait}
.icon-btn{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted);font-size:12px}

/* ===== Filtros ===== */
.search{position:relative;flex:1;min-width:240px}
.search input{padding-left:38px}
.search::before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-52%);color:var(--c1);font-size:18px}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:500 12px Inter,sans-serif;cursor:pointer;background:var(--card);color:var(--muted);transition:.2s}
.chip:hover{border-color:var(--c1);color:var(--c1)}
.chip.on{background:var(--grad);color:#05070f;border-color:transparent;font-weight:700}

/* ===== Tabla ===== */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;max-height:70vh}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:1320px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{
  position:sticky;top:0;z-index:2;background:var(--card-solid);
  font:600 11px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  cursor:pointer;user-select:none;white-space:nowrap;border-bottom:1px solid var(--line-strong);
}
thead th:hover{color:var(--c1)}
tbody tr{transition:background .15s}
tbody tr:hover td{background:var(--row-hover)}
tbody tr:last-child td{border-bottom:0}
td.mono{font-size:12.5px;white-space:nowrap}
td.ip a{color:var(--c1);text-decoration:none}
td.ip a:hover{text-shadow:0 0 10px var(--c1)}
td.notes{max-width:240px;white-space:pre-wrap;color:var(--muted);font-size:13px}
td.addr{max-width:200px;color:var(--muted);font-size:13px}
td.client b{font-family:"Space Grotesk",sans-serif;font-weight:600}
.type{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(124,77,255,.10);font-size:12px;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid currentColor}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
.b-ok{color:var(--ok);background:rgba(43,255,136,.07)}
.b-warn{color:var(--warn);background:rgba(255,197,61,.08)}
.b-off{color:var(--off);background:rgba(143,153,184,.08)}
.b-bad{color:var(--bad);background:rgba(255,77,109,.08)}
.empty{text-align:center;color:var(--muted);padding:40px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}

/* ===== Login ===== */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:400px;padding:34px 30px}
.login-card::before{
  content:"";position:absolute;inset:-1px;border-radius:18px;padding:1px;background:var(--grad);opacity:.6;pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
}
.login-card .logo-mark{width:54px;height:54px;font-size:1.2rem;border-radius:15px;margin:0 auto 16px}
.login-card h1{text-align:center;margin:0 0 4px;font-size:24px}
.login-card .sub{text-align:center;color:var(--muted);font:500 11px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;margin:0 0 24px}
.login-card form{display:grid;gap:14px}
.login-card button.primary{width:100%;padding:12px;font-size:14px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:0}
.back{display:block;text-align:center;margin-top:14px;color:var(--muted);font-size:12px;text-decoration:none}
.back:hover{color:var(--c1)}

/* ===== Toast ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,10px);background:var(--card-solid);color:var(--text);border:1px solid var(--c1);box-shadow:0 0 24px rgba(0,229,255,.25);padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:50;font-weight:500}
.toast.show{opacity:1;transform:translate(-50%,0)}

.hidden{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:10px}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  header .actions,.no-print,.glow{display:none!important}
  body{background:#fff;color:#000} body::before{display:none}
  .card,.table-wrap{border:none;background:none;max-height:none;overflow:visible}
  thead th{position:static;background:#fff;color:#000}
}

/* Dirección compacta en la tabla */
td.addr{max-width:210px}
td.addr a{display:block;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Selector de idioma */
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.lang button{border:0;background:none;padding:5px 10px;border-radius:999px;font:600 11px "JetBrains Mono",monospace;color:var(--muted)}
.lang button:hover{color:var(--c1)}
.lang button.on{background:var(--grad);color:#05070f}
.lang-login{position:absolute;top:16px;right:16px}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="card login-card">
    <div class="lang lang-login no-print"><button data-lang="en" onclick="setLang('en')">EN</button><button data-lang="es" onclick="setLang('es')">ES</button></div>
    <div class="logo-mark">AJ</div>
    <h1 data-i18n="login_title">Inventory</h1>
    <p class="sub">Network Asset Manager</p>
    <form onsubmit="doLogin(event)">
      <label><span data-i18n="username">Username</span><input id="lgUser" autocomplete="username" required autofocus data-i18n-ph="username_ph" placeholder="your username"></label>
      <label><span data-i18n="password">Password</span><input id="lgPass" type="password" autocomplete="current-password" required placeholder="••••••••"></label>
      <button class="primary" id="lgBtn" data-i18n="sign_in">Sign in →</button>
      <p class="err" id="lgErr"></p>
    </form>
    <a class="back" href="/">← AJ Tech Support</a>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
<header>
  <div class="brand">
    <div class="logo-mark">AJ</div>
    <div><h1 data-i18n="app_title">Equipment Inventory</h1><small>Network Asset Manager</small></div>
  </div>
  <div class="actions no-print">
    <button onclick="loadData()" data-i18n-title="t_refresh"><span data-i18n="refresh">↻ Refresh</span></button>
    <button onclick="exportJSON()" data-i18n-title="t_backup"><span data-i18n="backup">⤓ Backup</span></button>
    <button onclick="exportCSV()" data-i18n-title="t_csv">⊞ CSV</button>
    <button onclick="document.getElementById('fileIn').click()" data-i18n-title="t_import"><span data-i18n="import">⤒ Import</span></button>
    <input type="file" id="fileIn" accept=".json,.csv" hidden onchange="importFile(event)">
    <button id="migrarBtn" class="hidden" onclick="migrarLocal()" data-i18n="upload_local">Upload local data</button>
    <button class="icon-btn" onclick="window.print()" data-i18n-title="t_print">⎙</button>
    <button class="icon-btn" onclick="toggleTheme()" data-i18n-title="t_theme">🌓</button>
    <button class="icon-btn" onclick="cambiarPassword()" data-i18n-title="t_changepw">🔑</button>
    <div class="lang"><button data-lang="en" onclick="setLang('en')">EN</button><button data-lang="es" onclick="setLang('es')">ES</button></div>
    <span class="user-chip"><span class="dot"></span><span id="whoami"></span></span>
    <button onclick="logout()" data-i18n-title="t_logout"><span data-i18n="logout">Log out ⏻</span></button>
  </div>
</header>

<div class="wrap">
  <div class="kpis no-print">
    <div class="kpi"><span data-i18n="k_devices">Devices</span><b id="kTotal">0</b></div>
    <div class="kpi"><span data-i18n="k_clients">Clients</span><b id="kClientes">0</b></div>
    <div class="kpi"><span data-i18n="k_active">Active</span><b class="ok" id="kActivos">0</b></div>
    <div class="kpi"><span data-i18n="k_repair">In repair</span><b class="warn" id="kRep">0</b></div>
  </div>

  <div class="card no-print">
    <form id="form" onsubmit="save(event)">
      <div class="client-box">
        <div class="sec"><i>01</i> <span data-i18n="sec_client">Client</span></div>
        <div class="grid2">
          <label><span data-i18n="client">Client</span><input id="cliente" list="clientes" required data-i18n-ph="client_ph" placeholder="e.g. Advance Medical" onchange="autoDireccion()"></label>
          <label><span data-i18n="address">Address</span>
            <div class="addr-wrap">
              <input id="direccion" autocomplete="off" data-i18n-ph="address_ph" placeholder="Start typing the address..."
                oninput="buscarDireccion(this.value)" onkeydown="navDireccion(event)" onblur="setTimeout(cerrarSugerencias,150)">
              <button type="button" class="maps-btn" onclick="abrirMapa($('direccion').value)" data-i18n-title="t_maps">📍 Maps</button>
              <div id="addrList" class="suggest hidden"></div>
            </div>
          </label>
        </div>
      </div>

      <div class="sec"><i>02</i> <span data-i18n="sec_device">Device</span></div>
      <div class="grid">
        <label><span data-i18n="type">Type</span>
          <select id="tipo" required onchange="updateMarcas()"></select>
        </label>
        <label><span data-i18n="name">Name</span><input id="nombre" required data-i18n-ph="name_ph" placeholder="e.g. Main DVR"></label>
        <label><span data-i18n="area">Location (area)</span><input id="lugar" list="lugares" data-i18n-ph="area_ph" placeholder="e.g. Front desk, IT rack"></label>
        <label><span data-i18n="brand">Brand / Model</span><input id="modelo" list="marcas" autocomplete="off" data-i18n-ph="brand_ph" placeholder="Type or pick a brand"></label>
        <label><span data-i18n="serial">Serial</span><input id="serial" placeholder="SN"></label>
        <label>IP<input id="ip" placeholder="192.168.1.10" inputmode="decimal" maxlength="15" autocomplete="off"
          pattern="((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)"
          data-i18n-title="t_ip" oninput="formatIP(this)"></label>
        <label>MAC<input id="mac" placeholder="AA:BB:CC:DD:EE:FF" maxlength="17" autocomplete="off"
          pattern="([0-9A-F]{2}:){5}[0-9A-F]{2}"
          data-i18n-title="t_mac" oninput="formatMAC(this)"></label>
        <label><span data-i18n="username">Username</span><input id="usuario" autocomplete="off" placeholder="admin"></label>
        <label><span data-i18n="password">Password</span>
          <span class="pw">
            <input id="password" type="password" autocomplete="new-password" placeholder="••••••">
            <button type="button" class="sm" onclick="togglePwField()" data-i18n-title="t_showhide">👁</button>
          </span>
        </label>
        <label><span data-i18n="status">Status</span>
          <select id="estado"></select>
        </label>
        <label class="full"><span data-i18n="notes">Notes</span><textarea id="notas" data-i18n-ph="notes_ph" placeholder="Ports, channels, configuration, etc."></textarea></label>
      </div>
      <datalist id="clientes"></datalist>
      <datalist id="direcciones"></datalist>
      <datalist id="lugares"></datalist>
      <datalist id="marcas"></datalist>
      <div class="row" style="margin-top:16px">
        <button class="primary" type="submit" id="saveBtn" data-i18n="add_device">Add device</button>
        <button type="button" onclick="resetForm()" data-i18n="clear">Clear</button>
        <label class="check"><input type="checkbox" id="keepClient" checked> <span data-i18n="keep_client">Keep client after adding</span></label>
        <span class="muted" id="editMsg"></span>
      </div>
    </form>
  </div>

  <div class="card">
    <div class="card-title"><h3 data-i18n="registered">Registered devices</h3><span class="muted mono" id="count"></span></div>
    <div class="row no-print" style="margin-bottom:12px">
      <div class="search"><input id="q" data-i18n-ph="search_ph" placeholder="Search by client, name, IP, MAC, serial, model, notes..." oninput="render()"></div>

/* ---------- Login ---------- */
async function init(){
  if (SUPABASE_URL.includes('TU-PROYECTO') || SUPABASE_KEY.includes('XXXX')){
    document.body.innerHTML = '<div class="wrap"><div class="card"><h1>Falta configurar</h1><p>Abre <b>index.html</b> y pon tu SUPABASE_URL y SUPABASE_KEY en la sección CONFIGURACIÓN.</p></div></div>';
    return;
  }
  if (typeof supabase === 'undefined'){
    $('lgErr').textContent = t('e_supabase');
    return;
  }
  try{
    db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { data: { session } } = await db.auth.getSession();
    session ? showApp(session) : showLogin();
    db.auth.onAuthStateChange((ev, s) => { if (ev === 'SIGNED_OUT') showLogin(); });
  }catch(err){
    console.error(err);
    showLogin();
    $('lgErr').textContent = t('e_connect') + (err?.message || err);
  }
}
window.addEventListener('error', e => { const el = $('lgErr'); if (el) el.textContent = 'Error: ' + e.message; });
function showLogin(){ $('app').classList.add('hidden'); $('login').classList.remove('hidden'); items = []; }
function showApp(session){
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('whoami').textContent = (session.user.email || '').replace('@' + DOMINIO_USUARIOS, '');
  try{ const local = JSON.parse(localStorage.getItem(LOCAL_KEY)); if (Array.isArray(local) && local.length) $('migrarBtn').classList.remove('hidden'); }catch(e){}
  loadData();
}
async function doLogin(e){
  e.preventDefault();
  let u = $('lgUser').value.trim().toLowerCase();
  if (!u.includes('@')) u += '@' + DOMINIO_USUARIOS;
  $('lgBtn').disabled = true; $('lgErr').textContent = '';
  const { data, error } = await db.auth.signInWithPassword({ email: u, password: $('lgPass').value });
  $('lgBtn').disabled = false;
  if (error){ $('lgErr').textContent = t('e_login'); return; }
  $('lgPass').value = '';
  showApp(data.session);
}
async function logout(){ await db.auth.signOut(); showLogin(); }
async function cambiarPassword(){
  const p = prompt(t('pw_prompt')); if (!p) return;
  if (p.length < 6) return alert(t('pw_short'));
  const { error } = await db.auth.updateUser({ password: p });
  error ? fail(error, t('pw_fail')) : toast(t('pw_ok'));
}

async function loadData(){
  const { data, error } = await db.from('equipos').select('*').order('cliente');
  if (error) return fail(error, t('load_fail'));
  items = data; render();
}
function autoDireccion(){
  const c = $('cliente').value.trim();
  if (!c || $('direccion').value.trim()) return;
  const prev = items.find(x => x.cliente === c && x.direccion);
  if (prev) $('direccion').value = prev.direccion;
}
/* ---------- Formato IP / MAC ---------- */
const IP_RE  = /^((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)$/;
const MAC_RE = /^([0-9A-F]{2}:){5}[0-9A-F]{2}$/;
function formatIP(el){
  // Solo números y puntos, máximo 4 bloques de 3 dígitos
  let v = el.value.replace(/,/g, '.').replace(/[^\d.]/g, '').replace(/\.{2,}/g, '.').replace(/^\./, '');
  v = v.split('.').slice(0, 4).map(p => p.slice(0, 3)).join('.');
  el.value = v;
  el.setCustomValidity('');
}
function formatMAC(el){
  // Solo hexadecimal, mayúsculas, agrega ":" automáticamente
  const hex = el.value.toUpperCase().replace(/[^0-9A-F]/g, '').slice(0, 12);
  el.value = hex.match(/.{1,2}/g)?.join(':') || '';
  el.setCustomValidity('');
}
function validarIPMAC(){
  const ip = $('ip'), mac = $('mac');
  ip.setCustomValidity(ip.value && !IP_RE.test(ip.value) ? t('ip_invalid') : '');
  mac.setCustomValidity(mac.value && !MAC_RE.test(mac.value) ? t('mac_invalid') : '');
  return $('form').reportValidity();
}
function togglePwField(){ const p=$('password'); p.type = p.type==='password' ? 'text' : 'password'; }

async function save(e){
  e.preventDefault();
  if (!validarIPMAC()) return;
  const d = {}; FIELDS.forEach(f => d[f] = $(f).value);
  const row = clean(d);
  if (row.ip && items.some(x => x.ip === row.ip && x.cliente === row.cliente && x.id !== editId) &&
      !confirm(t('dup_ip', {ip: row.ip}))) return;
  $('saveBtn').disabled = true;
  const { error } = editId
    ? await db.from('equipos').update(row).eq('id', editId)
    : await db.from('equipos').insert(row);
  $('saveBtn').disabled = false;
  if (error) return fail(error, t('save_fail'));
  toast(editId ? t('saved') : t('added'));
  resetForm(true); loadData();
}
function resetForm(afterSave){
  const c = $('cliente').value, dir = $('direccion').value;
  $('form').reset(); editId = null;
  if (afterSave === true && $('keepClient').checked){ $('cliente').value = c; $('direccion').value = dir; }
  $('password').type = 'password';
  updateMarcas();
  $('saveBtn').textContent = t('add_device'); $('editMsg').textContent = '';
}
function edit(id){
  const x = items.find(i => i.id === id); if(!x) return;
  FIELDS.forEach(f => $(f).value = x[f] || '');
  formatMAC($('mac'));
  updateMarcas();
  editId = id; $('saveBtn').textContent = t('save_changes');
  $('editMsg').textContent = t('editing') + x.nombre;
  window.scrollTo({top:0, behavior:'smooth'});
}
async function del(id){
  const x = items.find(i => i.id === id);
  if (!confirm(t('confirm_del', {n: x.nombre}))) return;
  const { error } = await db.from('equipos').delete().eq('id', id);
  if (error) return fail(error, t('del_fail'));
  toast(t('deleted')); loadData();
}
function dup(id){
  const x = items.find(i => i.id === id); edit(id);
  editId = null; $('serial').value=''; $('ip').value=''; $('mac').value='';
  $('nombre').value = x.nombre + t('copy_suffix');
  $('saveBtn').textContent = t('add_device'); $('editMsg').textContent = t('duplicating');
}
function reveal(id){ revealed.has(id) ? revealed.delete(id) : revealed.add(id); render(); }
function copyPw(id){
  const x = items.find(i => i.id === id); if(!x || !x.password) return;
  navigator.clipboard?.writeText(x.password).then(() => toast(t('pw_copied')), () => toast(t('copy_fail')));
}

function filtered(){
  const q = $('q').value.toLowerCase().trim(), fl = $('fLugar').value, fc = $('fCliente').value;
  return items.filter(x =>
    (!fTipo || x.tipo === fTipo) && (!fl || x.lugar === fl) && (!fc || x.cliente === fc) &&
    (!q || FIELDS.filter(f => f !== 'password').some(f => String(x[f]||'').toLowerCase().includes(q)))
  ).sort((a,b) => {
    if (sortK === 'ip'){ const A=ipNum(a.ip), B=ipNum(b.ip); if(A!==null && B!==null) return (A-B)*sortDir; }
    return String(a[sortK]||'').localeCompare(String(b[sortK]||''), 'es', {numeric:true}) * sortDir;
  });
}

function abrirMapa(a){
  a = (a || '').trim();
  if (!a) return toast(t('addr_type_first'));
  window.open(mapUrl(a), '_blank', 'noopener');
}
function fmtDireccion(p){
  const calle = [p.housenumber, p.street].filter(Boolean).join(' ');
  const ciudad = p.city || p.town || p.village || p.district || p.locality || p.county || '';
  const st = p.countrycode === 'US' ? (US_ST[p.state] || p.state || '') : (p.state || '');
  const zona = [st, p.postcode].filter(Boolean).join(' ');
  const partes = [calle || p.name, ciudad, zona].filter(Boolean);
  if (p.countrycode && p.countrycode !== 'US' && p.country) partes.push(p.country);
  return [...new Set(partes)].join(', ');
}
function buscarDireccion(q){
  q = q.trim();
  clearTimeout(addrTimer);
  // 1) Direcciones que ya usaste (instantáneo)
  const ql = q.toLowerCase();
  const locales = q.length < 2 ? [] : uniq('direccion').filter(d => d.toLowerCase().includes(ql)).slice(0, 4)
    .map(d => ({ value: d, title: d, sub: t('addr_used'), src: 'guardada' }));
  addrOpts = locales; addrIdx = -1;
  if (q.length < 4){ pintarSugerencias(locales.length ? null : ''); return; }
  pintarSugerencias(t('addr_searching'));
  // 2) Búsqueda en el mapa (con pausa para no saturar)
  addrTimer = setTimeout(async () => {
    addrCtl?.abort(); addrCtl = new AbortController();
    const signal = addrCtl.signal, qx = expandirAbrev(q);
    const vistos = new Set(locales.map(o => o.value.toLowerCase()));
    const nuevos = arr => arr.filter(o => o.value && !vistos.has(o.value.toLowerCase()) && vistos.add(o.value.toLowerCase()));
    let remotos = [], errores = [];
    // Servicio 1: Photon (si no encuentra, reintenta sin estado / código postal)
    const qs = simplificar(qx);
    try{
      remotos = nuevos(await buscarPhoton(qx, signal));
      if (!remotos.length && qs !== qx) remotos = nuevos(await buscarPhoton(qs, signal));
    }
    catch(err){ if (err.name === 'AbortError') return; errores.push('Photon: ' + err.message); }
    // Servicio 2: Nominatim (solo si el primero falló o no encontró nada)
    if (!remotos.length){
      try{ remotos = nuevos(await buscarNominatim(qx, signal)); }
      catch(err){ if (err.name === 'AbortError') return; errores.push('Nominatim: ' + err.message); }
    }
    if ($('direccion').value.trim() !== q) return; // el usuario siguió escribiendo
    addrOpts = [...locales, ...remotos]; addrIdx = -1;
    if (addrOpts.length) pintarSugerencias();
    else if (errores.length){ console.warn('Búsqueda de dirección:', errores); pintarSugerencias(t('addr_err', {e: errores.join(' · ')})); }
    else pintarSugerencias(t('addr_none'));
  }, 400);
}
// Quita ", FL 33178" / "Florida" para una segunda búsqueda más simple
function simplificar(q){
  // Solo quita el código postal / estado del FINAL (no el número del edificio)
  return q.replace(/,?\s*\b(FL|Florida)\b\.?\s*(\d{5}(-\d{4})?)?\s*$/i, '')
          .replace(/,?\s*\d{5}(-\d{4})?\s*$/, '')
          .replace(/[,\s]+$/, '').trim();
}
// NW → Northwest, St → Street, etc. (así están guardadas las calles en OpenStreetMap)
function expandirAbrev(q){
  const M = {N:'North',S:'South',E:'East',W:'West',NW:'Northwest',NE:'Northeast',SW:'Southwest',SE:'Southeast',
    ST:'Street',AVE:'Avenue',AV:'Avenue',BLVD:'Boulevard',RD:'Road',DR:'Drive',CT:'Court',LN:'Lane',PL:'Place',
    TER:'Terrace',TERR:'Terrace',PKWY:'Parkway',HWY:'Highway',CIR:'Circle',WAY:'Way',TRL:'Trail'};
  return q.split(/\s+/).map(w => { const k = w.replace(/[.,]/g,'').toUpperCase(); return M[k] ? M[k] + (w.endsWith(',') ? ',' : '') : w; }).join(' ');
}
async function getJSON(url, signal){
  const r = await fetch(url, { signal, headers: { 'Accept': 'application/json' } });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
// Solo Florida: [oeste, sur, este, norte]
const FL_BBOX = [-87.7, 24.3, -79.8, 31.1];
// Si el mapa tiene la calle pero no el número, se usa el número que escribiste
function aSugerencia(p, q){
  if (p.state && p.state !== 'Florida') return null;
  const num = (($('direccion').value || q).match(/^\s*(\d+[A-Za-z]?)\b/) || [])[1];
  let agregado = false;
  if (!p.housenumber && p.street && num){ p = { ...p, housenumber: num }; agregado = true; }
  const value = fmtDireccion(p);
  const esLugar = p.name && p.name !== p.street && !p.housenumber;
  return {
    value,
    title: esLugar ? p.name : value,
    sub: agregado ? t('addr_numhint') : (esLugar ? value : ''),
    src: 'mapa'
  };
}
async function buscarPhoton(q, signal){
  const j = await getJSON(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=8&lat=${BIAS.lat}&lon=${BIAS.lon}&bbox=${FL_BBOX.join(',')}`, signal);
  return (j.features || []).map(f => aSugerencia({ ...(f.properties || {}) }, q)).filter(Boolean);
}
async function buscarNominatim(q, signal){
  const [w, s, e, n] = FL_BBOX;
  const j = await getJSON(`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&countrycodes=us&viewbox=${w},${n},${e},${s}&bounded=1&q=${encodeURIComponent(q)}`, signal);
  return (j || []).map(x => {
    const a = x.address || {};
    return aSugerencia({ housenumber:a.house_number, street:a.road, name:x.name,
      city:a.city || a.town || a.village || a.hamlet || a.suburb, county:a.county, state:a.state,
      postcode:a.postcode, countrycode:(a.country_code || '').toUpperCase(), country:a.country }, q);
  }).filter(Boolean);
}
function pintarSugerencias(msg){
  const box = $('addrList');
  if (!addrOpts.length && !msg){ box.classList.add('hidden'); return; }
  box.innerHTML = addrOpts.map((o, i) => `<div class="opt ${i === addrIdx ? 'on' : ''}" onmousedown="event.preventDefault();elegirDireccion(${i})">
      <span class="ic">${o.src === 'guardada' ? '🕘' : '📍'}</span>
      <span><span class="t">${esc(o.title)}</span>${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</span>
      <span class="src">${o.src === 'guardada' ? t('src_saved') : t('src_map')}</span></div>`).join('') + (msg ? `<div class="msg">${esc(msg)}</div>` : '');
  box.classList.remove('hidden');
}
function elegirDireccion(i){
  const o = addrOpts[i]; if (!o) return;
  $('direccion').value = o.value;
  cerrarSugerencias();
}
function cerrarSugerencias(){ $('addrList').classList.add('hidden'); addrIdx = -1; }
function navDireccion(e){
  const box = $('addrList');
  if (box.classList.contains('hidden') || !addrOpts.length) return;
  if (e.key === 'ArrowDown'){ e.preventDefault(); addrIdx = (addrIdx + 1) % addrOpts.length; pintarSugerencias(); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); addrIdx = (addrIdx - 1 + addrOpts.length) % addrOpts.length; pintarSugerencias(); }
  else if (e.key === 'Enter' && addrIdx >= 0){ e.preventDefault(); elegirDireccion(addrIdx); }
  else if (e.key === 'Escape'){ cerrarSugerencias(); }
}

function updateMarcas(){
  const tipo = $('tipo').value;
  const base = MARCAS[tipo] || [...new Set(Object.values(MARCAS).flat())].sort();
  // También sugiere modelos que ya usaste en ese tipo de equipo
  const usados = items.filter(x => x.tipo === tipo && x.modelo).map(x => x.modelo);

    <td><span class="type">${TIPO_ICON[x.tipo] || '◆'} ${esc(tTipo(x.tipo))}</span></td><td>${esc(x.nombre)}</td><td>${esc(x.lugar)}</td><td>${esc(x.modelo)}</td>
    <td class="mono">${esc(x.serial)}</td>
    <td class="mono ip">${x.ip ? `<a href="http://${esc(x.ip)}" target="_blank" rel="noopener">${esc(x.ip)}</a>` : ''}</td>
    <td class="mono">${esc(x.mac)}</td><td class="mono">${esc(x.usuario)}</td><td class="mono">${pw}</td>

function setTipo(t){ fTipo = t; render(); }
document.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => {

});

/* ---------- Exportar / Importar ---------- */
function download(name, content, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const stamp = () => new Date().toISOString().slice(0,10);
function exportJSON(){ download(`inventario-${stamp()}.json`, JSON.stringify(items.map(clean), null, 2), 'application/json'); }
function exportCSV(){
  const incluirPw = confirm(t('csv_pw'));
  const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const csv = [FIELDS.join(','), ...filtered().map(x => FIELDS.map(f => q(f==='password' && !incluirPw ? '' : x[f])).join(','))].join('\r\n');
  download(`inventario-${stamp()}.csv`, '\uFEFF' + csv, 'text/csv;charset=utf-8');
}
function parseCSV(text){
  const rows = []; let row = [], cell = '', inQ = false;
  text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQ){ if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else inQ = false; } else cell += c; }
    else if (c === '"') inQ = true;
    else if (c === ',' || c === ';'){ row.push(cell); cell = ''; }
    else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  const head = rows.shift().map(h => h.trim().toLowerCase());
  return rows.filter(r => r.some(v => v.trim())).map(r => { const o = {}; head.forEach((h,i) => o[h] = (r[i]||'').trim()); return o; });
}
async function subir(lista){
  const rows = lista.map(clean).filter(r => r.nombre).map(r => ({...r, cliente: r.cliente || t('no_client')}));
  if (!rows.length) { alert(t('no_valid')); return false; }
  if (!confirm(t('confirm_upload', {n: rows.length}))) return false;
  for (let i = 0; i < rows.length; i += 500){
    const { error } = await db.from('equipos').insert(rows.slice(i, i + 500));
    if (error){ fail(error, t('upload_fail')); return false; }
  }
  toast(t('uploaded', {n: rows.length})); loadData(); return true;
}
function importFile(e){
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = async () => {
    try{
      const data = file.name.toLowerCase().endsWith('.csv') ? parseCSV(r.result) : JSON.parse(r.result);
      if(!Array.isArray(data)) throw 0;
      await subir(data);
    }catch(err){ alert(t('bad_file')); }
    e.target.value = '';
  };
  r.readAsText(file);
}
async function migrarLocal(){
  try{
    const local = JSON.parse(localStorage.getItem(LOCAL_KEY)) || [];
    if (await subir(local) && confirm(t('local_done'))){
      localStorage.removeItem(LOCAL_KEY); $('migrarBtn').classList.add('hidden');
    }
  }catch(e){ alert(t('no_local')); }
}
